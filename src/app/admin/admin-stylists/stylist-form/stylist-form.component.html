<div class="admin-page">
  <header class="admin-page__header">
    <div>
      <h1 class="admin-page__title">{{ editId() ? 'Edit Stylist' : 'Add Stylist' }}</h1>
    </div>
    <button type="button" class="action-btn action-btn--outline" (click)="cancel()">← Cancel</button>
  </header>

  <form class="sty-form" (ngSubmit)="save()" #f="ngForm">
    <div class="form-grid">
      <!-- Name -->
      <div class="form-group">
        <label class="form-label" for="name">Name *</label>
        <input
          id="name" class="form-input" type="text" name="name"
          [ngModel]="form().name" (ngModelChange)="setField('name', $event)"
          placeholder="e.g. Jasmine Torres" required
        />
      </div>

      <!-- Title -->
      <div class="form-group">
        <label class="form-label" for="title">Title *</label>
        <input
          id="title" class="form-input" type="text" name="title"
          [ngModel]="form().title" (ngModelChange)="setField('title', $event)"
          placeholder="e.g. Braiding Specialist" required
        />
      </div>

      <!-- Years Experience -->
      <div class="form-group">
        <label class="form-label" for="yearsExperience">Years of Experience</label>
        <input
          id="yearsExperience" class="form-input" type="number" name="yearsExperience" min="0"
          [ngModel]="form().yearsExperience" (ngModelChange)="setField('yearsExperience', +$event)"
        />
      </div>

      <!-- Instagram -->
      <div class="form-group">
        <label class="form-label" for="instagramUrl">Instagram URL</label>
        <input
          id="instagramUrl" class="form-input" type="url" name="instagramUrl"
          [ngModel]="form().instagramUrl" (ngModelChange)="setField('instagramUrl', $event)"
          placeholder="https://instagram.com/…"
        />
      </div>

      <!-- Bio -->
      <div class="form-group form-group--full">
        <label class="form-label" for="bio">Bio</label>
        <textarea
          id="bio" class="form-input form-input--textarea" name="bio" rows="5"
          [ngModel]="form().bio" (ngModelChange)="setField('bio', $event)"
          placeholder="Background, training, what they love about the craft…"
        ></textarea>
      </div>

      <!-- Image URL -->
      <div class="form-group form-group--full">
        <label class="form-label" for="imageUrl">Photo URL</label>
        <input
          id="imageUrl" class="form-input" type="url" name="imageUrl"
          [ngModel]="form().imageUrl" (ngModelChange)="setField('imageUrl', $event)"
          placeholder="https://…"
        />
        @if (form().imageUrl) {
          <img class="sty-form__preview" [src]="form().imageUrl" alt="Preview" />
        }
      </div>

      <!-- Specialties -->
      <div class="form-group form-group--full">
        <label class="form-label" for="specialties">Specialties (comma-separated)</label>
        <input
          id="specialties" class="form-input" type="text" name="specialties"
          [ngModel]="specialtiesRaw()" (ngModelChange)="specialtiesRaw.set($event)"
          placeholder="Box Braids, Cornrows, Kids Styles"
        />
      </div>

      <!-- Toggles -->
      <div class="form-group form-group--checks">
        <label class="check-label">
          <input
            type="checkbox" name="isAvailable"
            [ngModel]="form().isAvailable" (ngModelChange)="setField('isAvailable', $event)"
          />
          Available for booking
        </label>
      </div>
    </div>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <div class="form-actions">
      <button class="action-btn" type="submit" [disabled]="saving()">
        @if (saving()) { Saving… } @else { Save Stylist }
      </button>
      <button class="action-btn action-btn--outline" type="button" [disabled]="saving()" (click)="cancel()">
        Cancel
      </button>
    </div>
  </form>

  <!-- Unsaved-changes dialog -->
  @if (showCancelDialog()) {
    <div class="confirm-overlay" (click)="dismissDialog()">
      <div class="confirm-dialog" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
        <h2 class="confirm-dialog__title" id="dlg-title">Discard changes?</h2>
        <p class="confirm-dialog__body">You have unsaved changes. If you leave now they will be lost.</p>
        <div class="confirm-dialog__actions">
          <button class="action-btn action-btn--danger" type="button" (click)="confirmCancel()">Discard</button>
          <button class="action-btn action-btn--outline" type="button" (click)="dismissDialog()">Keep editing</button>
        </div>
      </div>
    </div>
  }
</div>
