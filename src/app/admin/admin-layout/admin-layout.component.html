<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">
      <span class="admin-sidebar__logo-script">Labelle</span>
      <span class="admin-sidebar__logo-label">Admin Portal</span>
    </div>
    <nav class="admin-sidebar__nav" aria-label="Admin navigation">
      @for (item of navItems; track item.route) {
        <a
          class="admin-sidebar__link"
          [routerLink]="item.route"
          routerLinkActive="active"
        >
          <span class="admin-sidebar__link-icon" aria-hidden="true">{{ item.icon }}</span>
          <span class="admin-sidebar__link-label">{{ item.label }}</span>
        </a>
      }
    </nav>
    <div class="admin-sidebar__footer">
      <app-theme-toggle />
      <a class="admin-sidebar__back-btn" [routerLink]="'/'">← Back to Website</a>
      <button class="admin-sidebar__logout-btn" (click)="logout()">Sign Out</button>
    </div>
  </aside>

  <!-- Main content area -->
  <main class="admin-main">
    <router-outlet />
  </main>
</div>
